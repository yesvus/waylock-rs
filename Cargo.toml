[package]
name = "waylock-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A minimal native Wayland session locker"
license = "MIT"
readme = "README.md"
keywords = ["wayland", "screen-locker", "pam", "linux"]
categories = ["command-line-utilities"]

[[bin]]
name = "waylock-rs"
path = "src/main.rs"

[dependencies]
libc = "0.2"
pam-client2 = { version = "0.5.5", default-features = false }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
